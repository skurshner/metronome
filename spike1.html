<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Metronome Spike</title>
<style>
body{margin:0;padding:env(safe-area-inset-top) 16px 24px;background:#2a2a2a;color:#eee;font:16px -apple-system,sans-serif}
h1{font-size:18px}label{display:block;margin:12px 0 4px;color:#aaa}
input,select,button{font-size:20px;padding:10px;border-radius:10px;border:0;background:#3a3a3a;color:#fff;width:100%;box-sizing:border-box}
button{margin-top:16px;background:#555}pre{white-space:pre-wrap;color:#9c9;font-size:13px}
</style></head><body>
<h1>Phase 0: lock-screen test</h1>
<label>BPM</label><input id="bpm" type="number" value="120" min="20" max="400">
<label>Beats per bar</label><input id="num" type="number" value="4" min="1" max="16">
<label>Subdivision (clicks per beat)</label>
<select id="sub"><option value="1">Quarter</option><option value="2">Eighth</option><option value="3">Triplet</option><option value="4">Sixteenth</option></select>
<button id="go">Start</button>
<pre id="log"></pre>
<script>
const $=id=>document.getElementById(id), log=m=>{$('log').textContent=new Date().toLocaleTimeString()+' '+m+'\n'+$('log').textContent};
const SR=44100; let audio,startWall=0,loopLen=0;

function render(bpm,num,sub){
  const beat=60/bpm, barSec=beat*num;
  const bars=Math.max(1,Math.ceil(120/barSec)); // ~2+ min loop, whole bars
  const len=Math.round(bars*barSec*SR);
  const buf=new Float32Array(len);
  const click=(t,freq,gain)=>{ // short decaying sine burst
    const s=Math.round(t*SR),n=Math.round(0.04*SR);
    for(let i=0;i<n&&s+i<len;i++) buf[s+i]+=Math.sin(2*Math.PI*freq*i/SR)*Math.exp(-i/(n/6))*gain;
  };
  for(let b=0;b<bars*num;b++) for(let k=0;k<sub;k++){
    const t=b*beat+k*beat/sub, down=(b%num===0);
    if(k===0) click(t,down?1500:1000,down?1:0.7); else click(t,800,0.3);
  }
  return {wav:toWav(buf),dur:len/SR};
}
function toWav(f){
  const b=new ArrayBuffer(44+f.length*2),v=new DataView(b),w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,36+f.length*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,SR,true);v.setUint32(28,SR*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,f.length*2,true);
  for(let i=0;i<f.length;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,f[i]))*32767,true);
  return new Blob([b],{type:'audio/wav'});
}
async function start(){
  stop();
  const {wav,dur}=render(+$('bpm').value,+$('num').value,+$('sub').value);
  loopLen=dur; audio=new Audio(URL.createObjectURL(wav)); audio.loop=true;
  await audio.play(); startWall=Date.now();
  log(`playing, loop=${dur.toFixed(2)}s`);
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({title:`${$('bpm').value} BPM ${$('num').value}/4`,artist:'Metronome'});
    navigator.mediaSession.setActionHandler('play',()=>audio.play());
    navigator.mediaSession.setActionHandler('pause',()=>audio.pause());
    navigator.mediaSession.setActionHandler('nexttrack',()=>{$('bpm').value=+$('bpm').value+5;start()});
    navigator.mediaSession.setActionHandler('previoustrack',()=>{$('bpm').value=+$('bpm').value-5;start()});
  }
  $('go').textContent='Stop';
}
function stop(){ if(audio){audio.pause();audio=null} $('go').textContent='Start' }
$('go').onclick=()=>audio?stop():start();
// drift check: after returning from lock, compare audio clock to wall clock
document.addEventListener('visibilitychange',()=>{
  if(!audio||document.hidden) return log('hidden (locked/backgrounded)');
  const wall=((Date.now()-startWall)/1000)%loopLen, a=audio.currentTime;
  let d=a-wall; if(d>loopLen/2)d-=loopLen; if(d<-loopLen/2)d+=loopLen;
  log(`visible. paused=${audio.paused} drift=${d.toFixed(3)}s`);
});
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script></body></html>
